name: validate

# Structural validation and tests for every pull request.
# Checks structure only; a passing run does not validate or release any skill.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install hash-locked dependencies
        run: |
          pip install --require-hashes --only-binary=:all: --no-deps -r tools/requirements.txt
      - name: Run structural validator
        run: python -m tools.karaz_validate
      - name: Run structural tests
        run: python -m unittest discover -s tests/structure
