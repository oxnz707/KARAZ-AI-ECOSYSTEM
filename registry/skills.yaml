schema_version: "1.0"

ecosystem:
  name: "KARAZ AI ECOSYSTEM"
  version: "0.1.0"
  description: "A platform-independent library of reusable AI capabilities."

registry_rules:
  unique_ids: true
  semantic_versioning: true
  require_skill_documentation: true
  require_validation_before_release: true
  require_dependency_declarations: true
  require_platform_compatibility_declarations: true

lifecycle_statuses:
  - proposed
  - draft
  - validated
  - released
  - deprecated
  - retired

skill_types:
  - core
  - meta
  - specialist

skills: []
